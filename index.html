<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Micron Barcode List Generator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,'Noto Sans KR',sans-serif;background:#fef9e7;color:#1a1a2e;font-size:14px}
header{background:#1a2a4a;color:white;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .logo{font-size:22px;font-weight:900;color:#e74c3c;letter-spacing:2px;white-space:nowrap}
header h1{font-size:20px;font-weight:900;text-align:center;flex:1}
header .header-right{display:flex;align-items:center;gap:12px;white-space:nowrap}
header .factory{font-size:15px;font-weight:700}
.lang-select{background:#2a3a5a;color:white;border:1px solid #4a5a7a;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;outline:none}
.lang-select:hover{background:#3a4a6a}
.container{max-width:1300px;margin:0 auto;padding:16px}
.section{background:white;border:1px solid #d4d4d4;border-radius:8px;padding:14px;margin-bottom:14px}
.section-title{font-size:13px;font-weight:700;color:#444;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:6px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info-item{display:flex;flex-direction:column;gap:4px}
.info-item label{font-size:12px;font-weight:700;color:#555}
.info-item input,.info-item select{border:1px solid #bbb;border-radius:4px;padding:7px 10px;font-size:14px;background:white}
.info-item input:focus,.info-item select:focus{outline:2px solid #2563eb;border-color:#2563eb}
.pn-row{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;align-items:start}
.pn-field{display:flex;flex-direction:column;gap:4px}
.pn-field label{font-size:12px;font-weight:700;color:#555}
.pn-input-wrap{display:flex;gap:6px}
.pn-input-wrap input{flex:1;border:1px solid #bbb;border-radius:4px;padding:7px 10px;font-size:14px}
.desc-display{background:#e8f5e9;border:2px solid #2e7d32;border-radius:4px;padding:8px 12px;font-size:15px;font-weight:700;color:#1b5e20;min-height:38px;display:flex;align-items:center}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:white;border:1px solid #d4d4d4;border-radius:8px;padding:12px;text-align:center}
.stat-box .val{font-size:26px;font-weight:900;color:#1a2a4a}
.stat-box .lbl{font-size:11px;color:#666;margin-top:2px}
.stat-box.highlight .val{color:#c0392b}
.boxes-section{background:white;border:1px solid #d4d4d4;border-radius:8px;padding:14px;margin-bottom:14px}
.boxes-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.boxes-header h3{font-size:14px;font-weight:700}
.boxes-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.box-row{background:#f8f9fa;border:1px solid #ddd;border-radius:6px;padding:8px;position:relative}
.box-row.filled{background:#e8f4f8;border-color:#2196F3}
.box-row.filled .box-start,.box-row.filled .box-end{color:#0d47a1;font-weight:700}
.box-label{font-size:11px;font-weight:700;color:#555;margin-bottom:4px}
.box-scan{width:100%;border:1px solid #ccc;border-radius:4px;padding:5px 7px;font-size:12px;background:white}
.box-scan:focus{outline:2px solid #2196F3;border-color:#2196F3}
.box-info{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.box-info-item{font-size:10px;color:#555}
.box-info-item span{display:block;font-size:12px;font-weight:700;color:#1a2a4a;word-break:break-all}
.box-qty{margin-top:4px;font-size:11px;font-weight:700;color:#2e7d32;text-align:right}
.box-del{position:absolute;top:4px;right:4px;background:none;border:none;cursor:pointer;color:#e74c3c;font-size:14px;padding:0;line-height:1}
.btn{border:0;border-radius:6px;padding:9px 18px;font-weight:700;cursor:pointer;font-size:13px}
.btn-primary{background:#1a2a4a;color:white}
.btn-primary:hover{background:#2a3a6a}
.btn-success{background:#2e7d32;color:white}
.btn-success:hover{background:#1b5e20}
.btn-warning{background:#f57c00;color:white}
.btn-warning:hover{background:#e65100}
.btn-danger{background:#c62828;color:white}
.btn-danger:hover{background:#b71c1c}
.btn-info{background:#0288d1;color:white}
.btn-info:hover{background:#01579b}
.btn-sm{padding:5px 10px;font-size:12px}
.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pn-mgmt{background:white;border:1px solid #d4d4d4;border-radius:8px;padding:14px;margin-bottom:14px}
.pn-mgmt-grid{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:end}
.pn-list{max-height:200px;overflow-y:auto;margin-top:10px;border:1px solid #eee;border-radius:4px}
.pn-list table{width:100%;border-collapse:collapse;font-size:12px}
.pn-list th{background:#f5f5f5;padding:6px 10px;text-align:left;font-weight:700;position:sticky;top:0}
.pn-list td{padding:5px 10px;border-top:1px solid #eee}
.pn-list tr:hover td{background:#f9f9f9}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:white;border-radius:10px;padding:24px;max-width:500px;width:100%;margin:20px}
.modal-box h3{margin-bottom:16px;font-size:16px}
.modal-box input{width:100%;border:1px solid #ccc;border-radius:4px;padding:8px;margin-bottom:10px;font-size:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.msg{padding:8px 12px;border-radius:4px;font-size:13px;font-weight:600;margin-top:8px}
.msg.ok{background:#e8f5e9;color:#2e7d32}
.msg.err{background:#ffebee;color:#c62828}
@media(max-width:900px){.boxes-grid{grid-template-columns:repeat(3,1fr)}.info-grid{grid-template-columns:1fr 1fr}.pn-row{grid-template-columns:1fr}}
@media(max-width:600px){.boxes-grid{grid-template-columns:repeat(2,1fr)}.summary-bar{grid-template-columns:repeat(2,1fr)}}

</head>
<body>
<header>
  <div class="logo">▲ PEAK</div>
  <h1>Micron Barcode List Generator</h1>
  <div class="header-right">
<select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
      <option value="ko">🇰🇷 한국어</option>
      <option value="en">🇺🇸 English</option>
      <option value="zh">🇨🇳 简体中文</option>
      <option value="tw">🇹🇼 繁體中文</option>
    </select>
  </div>
</header>

<div class="container">

<!-- Shipment Info -->
<div class="section">
  <div class="section-title" data-i18n="shipInfo">출하 정보 (Shipment Information)</div>
  <div class="info-grid">
    <div class="info-item">
      <label data-i18n="shipDate">출하일 (Shipment Date)</label>
      <input type="date" id="shipDate"/>
    </div>
    <div class="info-item">
      <label data-i18n="shipTo">출하처/고객명 (Ship To)</label>
      <input type="text" id="shipTo" data-i18n-ph="shipToPlh" placeholder="고객명 입력..."/>
    </div>
    <div class="info-item">
      <label data-i18n="remark">비고 (Remark)</label>
      <input type="text" id="remark" data-i18n-ph="remarkPlh" placeholder="메모 입력..."/>
    </div>
  </div>
</div>

<!-- PN & Description -->
<div class="section">
  <div class="section-title" data-i18n="pnSection">파트 번호 / 트레이 설명 (Part No. / Tray Description)</div>
  <div class="pn-row">
    <div class="pn-field">
      <label data-i18n="pnLabel">PEAK PN (파트 넘버 스캔 또는 입력)</label>
      <div class="pn-input-wrap">
        <input type="text" id="peakPN" placeholder="예: 1M999180000E" autocomplete="off"/>
        <button class="btn btn-primary btn-sm" onclick="lookupPN()" data-i18n="btnLookup">조회</button>
        <button class="btn btn-info btn-sm" onclick="showPNMgmt()" data-i18n="btnManage">관리</button>
      </div>
      <div id="pnMsg" style="height:16px;margin-top:2px;font-size:11px"></div>
    </div>
    <div class="pn-field">
      <label data-i18n="trayLabel">Tray Description (자동 표시)</label>
      <div class="desc-display" id="trayDesc" data-i18n="trayPlh">— 파트 넘버를 입력하면 자동으로 표시됩니다 —</div>
    </div>
  </div>
</div>

<!-- Summary -->
<div class="summary-bar">
  <div class="stat-box"><div class="val" id="totalBoxes">0</div><div class="lbl" data-i18n="statBoxes">스캔 박스 수</div></div>
  <div class="stat-box highlight"><div class="val" id="totalQty">0</div><div class="lbl" data-i18n="statQty">총 출하 수량</div></div>
  <div class="stat-box"><div class="val" id="avgQty">0</div><div class="lbl" data-i18n="statAvg">박스당 평균 수량</div></div>
  <div class="stat-box"><div class="val" id="totalBoxCount">0</div><div class="lbl" data-i18n="statSlots">등록된 박스 슬롯</div></div>
</div>

<!-- Action Bar -->
<div class="action-bar">
  <button class="btn btn-success" onclick="downloadExcel()" data-i18n="btnExcel">📥 Excel 저장</button>
  <button class="btn btn-primary" onclick="addMoreBoxes(10)" data-i18n="btnAddBox">+ 박스 10개 추가</button>
  <button class="btn btn-warning" onclick="clearAll()" data-i18n="btnClear">🗑 전체 초기화</button>
</div>

<!-- Box Scan Section -->
<div class="boxes-section">
  <div class="boxes-header">
    <h3 data-i18n="boxScanTitle">박스 스캔 (Scan All Box for Shipment) — 바코드 형식: PartNo/StartNo/EndNo</h3>
    <span id="scanHint" style="font-size:12px;color:#888" data-i18n="scanHint">스캔: PartNo/시작번호/끝번호</span>
  </div>
  <div class="boxes-grid" id="boxesGrid"></div>
</div>

<!-- PN Management Modal -->
<div class="modal" id="pnModal">
  <div class="modal-box">
    <h3 data-i18n="modalTitle">파트 번호 / 설명 관리</h3>
    <div class="pn-mgmt-grid">
      <div>
        <label style="font-size:12px;font-weight:700;display:block;margin-bottom:4px">SAP PN</label>
        <input type="text" id="newPN" data-i18n-ph="newPNPlh" placeholder="파트 넘버"/>
      </div>
      <div>
        <label style="font-size:12px;font-weight:700;display:block;margin-bottom:4px">Description</label>
        <input type="text" id="newDesc" data-i18n-ph="newDescPlh" placeholder="트레이 설명"/>
      </div>
      <div style="display:flex;align-items:flex-end">
        <button class="btn btn-success btn-sm" onclick="addPNEntry()" data-i18n="btnAdd">추가</button>
      </div>
    </div>
    <div id="addPNMsg" class="msg ok" style="display:none"></div>
    <div class="pn-list" id="pnListWrap"></div>
    <div class="modal-actions">
      <button class="btn btn-primary btn-sm" onclick="exportPNList()" data-i18n="btnExportPN">PN 목록 내보내기</button>
      <button class="btn btn-sm" onclick="closeModal()" data-i18n="btnClose">닫기</button>
    </div>
  </div>
</div>

let currentLang = localStorage.getItem('micron_lang') || 'ko';

function t(key) {
  return (LANGS[currentLang] && LANGS[currentLang][key]) || LANGS.ko[key] || key;
}

function applyLang() {
  document.getElementById('langSelect').value = currentLang;
  // text content
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    // Don't overwrite trayDesc if it has real content
    if (el.id === 'trayDesc' && el.textContent && !el.textContent.startsWith('—') && !el.textContent.includes('파트') && !el.textContent.includes('Enter') && !el.textContent.includes('输入') && !el.textContent.includes('輸入')) return;
    el.textContent = t(key);
  });
  // placeholders
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  // re-render boxes to update labels
  renderBoxes();
  updateSummary();
}

function changeLang(lang) {
  currentLang = lang;
  localStorage.setItem('micron_lang', lang);
  applyLang();

// ==================== STATE ====================
const STORAGE_KEY = 'micron_barcode_gen_v6';
let state = {
  boxes: [],      // [{scan, partNo, start, end, qty}]
  totalSlots: 100
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (s) state = s;
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ==================== INIT ====================
function init() {
  loadState();
  // set today's date
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  document.getElementById('shipDate').value = `${yyyy}-${mm}-${dd}`;

  // restore shipment info
  if (state.shipDate) document.getElementById('shipDate').value = state.shipDate;
  if (state.shipTo) document.getElementById('shipTo').value = state.shipTo;
  if (state.remark) document.getElementById('remark').value = state.remark;
  if (state.peakPN) {
    document.getElementById('peakPN').value = state.peakPN;
    lookupPN(true);
  }

  applyLang();

  // save shipment info on change
  ['shipDate','shipTo','remark'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      state[id] = document.getElementById(id).value;
      saveState();
    });
  });

  // PN input: auto-lookup on every keystroke
  document.getElementById('peakPN').addEventListener('input', () => {
    lookupPN(false);
  });
  // also keep Enter support
  document.getElementById('peakPN').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); lookupPN(); }
  });
}

// ==================== PN LOOKUP ====================
function lookupPN(silent) {
  const pn = document.getElementById('peakPN').value.trim().toUpperCase();
  const desc = PN_MAP[pn] || PN_MAP[document.getElementById('peakPN').value.trim()];
  const msgEl = document.getElementById('pnMsg');
  const descEl = document.getElementById('trayDesc');

  if (!pn) { descEl.textContent = t('trayPlhEmpty'); return; }

  if (desc) {
    descEl.textContent = desc;
    descEl.style.background = '#e8f5e9';
    descEl.style.borderColor = '#2e7d32';
    descEl.style.color = '#1b5e20';
    if (!silent) { msgEl.style.color='#2e7d32'; msgEl.textContent=t('msgFound'); }
    state.peakPN = document.getElementById('peakPN').value.trim();
    state.trayDesc = desc;
    saveState();
  } else {
    // try case-insensitive search
    const keys = Object.keys(PN_MAP);
    const found = keys.find(k => k.toUpperCase() === pn);
    if (found) {
      descEl.textContent = PN_MAP[found];
      descEl.style.background = '#e8f5e9';
      descEl.style.borderColor = '#2e7d32';
      descEl.style.color = '#1b5e20';
      if (!silent) { msgEl.style.color='#2e7d32'; msgEl.textContent=t('msgFound'); }
      state.peakPN = document.getElementById('peakPN').value.trim();
      state.trayDesc = PN_MAP[found];
      saveState();
    } else {
      descEl.textContent = t('msgPNNotInList');
      descEl.style.background = '#fff8e1';
      descEl.style.borderColor = '#f57c00';
      descEl.style.color = '#e65100';
      if (!silent) { msgEl.style.color='#e65100'; msgEl.textContent=t('msgNotFound'); }
    }
  }
}

// ==================== BOX RENDERING ====================
function renderBoxes() {
  const grid = document.getElementById('boxesGrid');
  grid.innerHTML = '';
  const total = Math.max(state.totalSlots || 100, state.boxes.length + 5);
  state.totalSlots = total;

  for (let i = 0; i < total; i++) {
    const box = state.boxes[i];
    const filled = box && box.scan;
    const div = document.createElement('div');
    div.className = 'box-row' + (filled ? ' filled' : '');
    div.innerHTML = `
      <div class="box-label">${t('boxLabel')} ${i+1}</div>
      <input type="text" class="box-scan" data-idx="${i}"
             value="${filled ? esc(box.scan) : ''}"
             placeholder="${t('boxPlh')}"
             autocomplete="off"/>
      ${filled ? `<div class="box-info">
        <div class="box-info-item">Start<span class="box-start">${box.start}</span></div>
        <div class="box-info-item">End<span class="box-end">${box.end}</span></div>
      </div>
      <div class="box-qty">${t('boxQtyLabel')} ${box.qty.toLocaleString()} pcs</div>
      <button class="box-del" onclick="clearBox(${i})" title="X">✕</button>` : ''}
    `;
    grid.appendChild(div);
  }

  // attach events
  grid.querySelectorAll('.box-scan').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); processBoxScan(parseInt(e.target.dataset.idx), e.target.value); }
    });
    input.addEventListener('change', e => {
      processBoxScan(parseInt(e.target.dataset.idx), e.target.value);
    });
  });

  document.getElementById('totalBoxCount').textContent = total;
}

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function processBoxScan(idx, rawValue) {
  const v = rawValue.trim();
  if (!v) { clearBox(idx); return; }

  // Parse: PartNo/StartNo/EndNo  or just StartNo/EndNo
  const parts = v.split('/').map(x => x.trim());
  let partNo = '', start = 0, end = 0;

  if (parts.length >= 3) {
    partNo = parts[0];
    start = Number(parts[1]);
    end = Number(parts[2]);
  } else if (parts.length === 2) {
    start = Number(parts[0]);
    end = Number(parts[1]);
  } else if (parts.length === 1 && !isNaN(Number(parts[0]))) {
    start = Number(parts[0]);
    end = Number(parts[0]);
  } else {
    alert(`Box ${idx+1}: ${t('alertFmt')}`);
    return;
  }

  if (!Number.isFinite(start) || !Number.isFinite(end)) {
    alert(`Box ${idx+1}: ${t('alertNum')}`);
    return;
  }
  if (end < start) {
    alert(`Box ${idx+1}: ${t('alertEndLt')}`);
    return;
  }

  const qty = end - start + 1;

  // If partNo scanned and differs from current PN, update
  if (partNo && !document.getElementById('peakPN').value.trim()) {
    document.getElementById('peakPN').value = partNo;
    lookupPN(true);
  }

  if (!state.boxes[idx]) state.boxes[idx] = {};
  state.boxes[idx] = { scan: v, partNo, start, end, qty };
  saveState();
  renderBoxes();
  updateSummary();

  // focus next box
  setTimeout(() => {
    const inputs = document.querySelectorAll('.box-scan');
    if (inputs[idx+1]) inputs[idx+1].focus();
  }, 50);
}

function clearBox(idx) {
  state.boxes[idx] = null;
  saveState();
  renderBoxes();
  updateSummary();
}

function addMoreBoxes(n) {
  state.totalSlots = (state.totalSlots || 100) + n;
  saveState();
  renderBoxes();
  updateSummary();
}

function updateSummary() {
  const filled = state.boxes.filter(b => b && b.scan);
  const totalQty = filled.reduce((s, b) => s + (b.qty||0), 0);
  const avg = filled.length ? Math.round(totalQty / filled.length) : 0;
  document.getElementById('totalBoxes').textContent = filled.length;
  document.getElementById('totalQty').textContent = totalQty.toLocaleString();
  document.getElementById('avgQty').textContent = avg.toLocaleString();
}

function clearAll() {
  if (!confirm(t('alertClear'))) return;

  // 오늘 날짜 계산
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  const todayStr = `${yyyy}-${mm}-${dd}`;

  // state 초기화
  state.boxes = [];
  state.totalSlots = 100;
  state.shipDate = todayStr;
  state.shipTo = '';
  state.remark = '';
  state.peakPN = '';
  state.trayDesc = '';
  saveState();

  // UI 초기화
  document.getElementById('shipDate').value = todayStr;
  document.getElementById('shipTo').value = '';
  document.getElementById('remark').value = '';
  document.getElementById('peakPN').value = '';

  const descEl = document.getElementById('trayDesc');
  descEl.textContent = t('trayPlhEmpty');
  descEl.style.background = '#e8f5e9';
  descEl.style.borderColor = '#2e7d32';
  descEl.style.color = '#1b5e20';

  document.getElementById('pnMsg').textContent = '';

  renderBoxes();
  updateSummary();
}

// ==================== EXCEL EXPORT ====================
function downloadExcel() {
  if (typeof XLSX === 'undefined') {
    alert(t('alertXlsx'));
    return;
  }

  const shipDate = document.getElementById('shipDate').value || '';
  const shipTo   = document.getElementById('shipTo').value || '';
  const remark   = document.getElementById('remark').value || '';
  const peakPN   = document.getElementById('peakPN').value || '';
  const trayDescEl = document.getElementById('trayDesc');
  const trayDesc = (trayDescEl && trayDescEl.textContent.startsWith('—')) ? '' : (trayDescEl ? trayDescEl.textContent : '');

  const filled   = state.boxes.filter(b => b && b.scan);
  const totalQty = filled.reduce((s, b) => s + (b.qty || 0), 0);

  // ── 공통 헤더 섹션 ────────────────────────────────────────────────
  function makeHeader(cols) {
    const empty = Array(cols).fill('');
    return [
      ['Micron Barcode List Generator', ...empty.slice(1)],
      ['Shipment Date', shipDate, ...empty.slice(2)],
      ['Ship To', shipTo, ...empty.slice(2)],
      ['PEAK PN', peakPN, ...empty.slice(2)],
      ['Tray Description', trayDesc, ...empty.slice(2)],
      ['Remark', remark, ...empty.slice(2)],
      empty,
      ['Scanned Boxes', filled.length, 'Total Qty', totalQty, ...empty.slice(4)],
      empty,
    ];
  }

  // ════════════════════════════════════════════════════════════════
  // 중복 검사: 박스 간 바코드 범위 겹침 여부 확인
  // ════════════════════════════════════════════════════════════════
  // 각 박스에 대해 다른 박스와 범위가 겹치는지 검사
  const dupFlags = filled.map((b, i) => {
    const s1 = Number(b.start), e1 = Number(b.end);
    const overlaps = [];
    filled.forEach((b2, j) => {
      if (i === j) return;
      const s2 = Number(b2.start), e2 = Number(b2.end);
      // 두 범위가 겹치면: s1 <= e2 AND s2 <= e1
      if (s1 <= e2 && s2 <= e1) {
        overlaps.push(j + 1); // 겹치는 박스 번호 (1-based)
      }
    });
    return overlaps;
  });

  const hasDup = dupFlags.some(d => d.length > 0);

  // 중복이 있으면 저장 전 경고 (저장은 계속 진행)
  if (hasDup) {
    const dupList = dupFlags
      .map((d, i) => d.length > 0 ? `Box ${i+1} ↔ Box ${d.join(', ')}` : null)
      .filter(Boolean).join('\n');
    alert(`⚠ Duplicate barcode numbers detected!\n\n${dupList}\n\nThe file will be saved, but please check the duplicates.`);
  }

  // ════════════════════════════════════════════════════════════════
  // Sheet 1: Shipment List — 박스별 요약 (1행 = 1박스)
  // ════════════════════════════════════════════════════════════════
  const summaryRows = [
    ...makeHeader(7),
    ['No.', 'Scan Data', 'Part No.', 'Start No.', 'End No.', 'Qty (pcs)', 'Duplicate Check'],
  ];
  filled.forEach((b, i) => {
    const dups = dupFlags[i];
    const dupStatus = dups.length === 0
      ? '✔ OK'
      : `⚠ Duplicate - Overlaps with Box ${dups.join(', ')}`;
    summaryRows.push([
      i + 1,
      b.scan,
      b.partNo || peakPN,
      Number(b.start),
      Number(b.end),
      b.qty,
      dupStatus,
    ]);
  });
  // 합계 행
  summaryRows.push([null, null, null, null, 'Total', totalQty,
    hasDup ? '⚠ Duplicates Found' : '✔ No Duplicates']);

  const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
  ws1['!cols'] = [
    { wch: 6 },
    { wch: 38 },
    { wch: 18 },
    { wch: 16 },
    { wch: 16 },
    { wch: 12 },
    { wch: 28 },
  ];

  // ════════════════════════════════════════════════════════════════
  // Sheet 2: detail — 바코드 번호별 상세 (1행 = 1개)
  // ════════════════════════════════════════════════════════════════
  const detailRows = [
    ...makeHeader(4),
    ['No.', 'Part No.', 'Barcode No.', ''],
  ];
  let seqNo = 1;
  filled.forEach(b => {
    const pn    = b.partNo || peakPN;
    const start = Number(b.start);
    const end   = Number(b.end);
    for (let num = start; num <= end; num++) {
      detailRows.push([seqNo++, num === start ? pn : null, num, null]);
    }
  });

  const ws2 = XLSX.utils.aoa_to_sheet(detailRows);
  ws2['!cols'] = [
    { wch: 26.66 },
    { wch: 31.83 },
    { wch: 17.16 },
    { wch: 17.0  },
  ];

  // ── 워크북 조립 ──────────────────────────────────────────────────
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'Shipment List');
  XLSX.utils.book_append_sheet(wb, ws2, 'detail');

  // ── 파일명: 날짜_파트넘버.xlsx ───────────────────────────────────
  const dateStr = shipDate.replace(/-/g, '') || new Date().toISOString().slice(0,10).replace(/-/g,'');
  const pnStr   = peakPN.replace(/[^a-zA-Z0-9]/g, '_').slice(0, 30) || 'UNKNOWN_PN';
  XLSX.writeFile(wb, `${dateStr}_${pnStr}.xlsx`);
}

// ==================== PN MANAGEMENT ====================
function showPNMgmt() {
  renderPNList();
  document.getElementById('pnModal').classList.add('show');
}
function closeModal() {
  document.getElementById('pnModal').classList.remove('show');
}
function renderPNList() {
  const wrap = document.getElementById('pnListWrap');
  const keys = Object.keys(PN_MAP).sort();
  const filter = (document.getElementById('pnSearch') || {value:''}).value.toLowerCase();
  const filtered = filter ? keys.filter(k => k.toLowerCase().includes(filter) || PN_MAP[k].toLowerCase().includes(filter)) : keys;
  wrap.innerHTML = `<table><thead><tr><th>SAP PN</th><th>Description</th><th></th></tr></thead><tbody>
    ${filtered.slice(0,200).map(k => `<tr><td>${esc(k)}</td><td>${esc(PN_MAP[k])}</td>
      <td><button style="border:none;background:none;cursor:pointer;color:#c62828;font-size:13px" onclick="deletePNEntry('${esc(k)}')">✕</button></td>
    </tr>`).join('')}
    ${filtered.length > 200 ? `<tr><td colspan="3" style="text-align:center;color:#888;padding:8px">… 외 ${filtered.length-200}개 (검색으로 필터링)</td></tr>` : ''}
  </tbody></table>`;
}
function addPNEntry() {
  const pn = document.getElementById('newPN').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  const msgEl = document.getElementById('addPNMsg');
  if (!pn || !desc) { msgEl.className='msg err'; msgEl.style.display='block'; msgEl.textContent=t('addPNErr'); return; }
  PN_MAP[pn] = desc;
  document.getElementById('newPN').value = '';
  document.getElementById('newDesc').value = '';
  msgEl.className='msg ok'; msgEl.style.display='block'; msgEl.textContent=`✔ "${pn}" ${t('addPNOk')}`;
  renderPNList();
  setTimeout(() => { msgEl.style.display='none'; }, 2000);
}
function deletePNEntry(pn) {
  if (!confirm(`"${pn}" ${t('delConfirm')}`)) return;
  delete PN_MAP[pn];
  renderPNList();
}
function exportPNList() {
  if (typeof XLSX === 'undefined') { alert(t('alertXlsx')); return; }
  const wb = XLSX.utils.book_new();
  const data = [['SAP PN','Description'], ...Object.entries(PN_MAP).sort((a,b) => a[0].localeCompare(b[0]))];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:22},{wch:50}];
  XLSX.utils.book_append_sheet(wb, ws, 'PN List');
  XLSX.writeFile(wb, 'PEAK_PN_List.xlsx');
}

// close modal on backdrop click
document.getElementById('pnModal').addEventListener('click', e => {
  if (e.target === document.getElementById('pnModal')) closeModal();
});

// ==================== START ====================
init();
</script>
